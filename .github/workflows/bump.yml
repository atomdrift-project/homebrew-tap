# Poll upstream using this repository's GITHUB_TOKEN. Complete binary sets
# and their signed checksums are required before any binary bump or conversion.

name: bump

on:
  schedule:
    # Twice an hour, offset off the hour to dodge the cron stampede.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      formula:
        description: "Bump only this formula. Empty checks all of them."
        type: string
        default: ""

permissions: {}

concurrency:
  # One writer at a time; never interrupt a run mid-push.
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump formulas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # persist-credentials stays on here, unlike the release workflows: this
      # job's whole purpose is to push back to the repo it checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - run: make automation-test

      - name: Bump formulas to their latest verified release
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.formula || '' }}
          SOURCE_GATE_MINUTES: "360"
          STUCK_WARN_MINUTES: "360"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          bash tools/bump.sh
