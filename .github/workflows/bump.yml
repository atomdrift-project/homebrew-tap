# Track upstream releases and bump the formulas that ship prebuilt binaries.
#
# The direction here is deliberate. The obvious design -- each project pushing
# to this tap at the end of its release -- needs a credential with write access
# to another repository, which GITHUB_TOKEN is not and cannot be. That means a
# PAT, a GitHub App private key, or an OIDC broker, all of which are long-lived
# secrets held by five repos to save a poll.
#
# Inverting it removes the credential entirely: a workflow in this repo writing
# to this repo uses the per-run GITHUB_TOKEN, and upstream releases are public
# to read. What is left is better than what the push model offered, because the
# tap can verify rather than trust. Every atomdrift release signs its SHA256SUMS
# with cosign in keyless mode, so before a single formula line changes we
# confirm those checksums came from that repo's release.yml at that tag. The
# checksums Homebrew will later enforce at install time are therefore the ones
# carried by a signature chaining to GitHub's OIDC identity, not merely the ones
# some token-bearing job asserted.
#
# It also fixes a race the push model has no answer for. A release matrix takes
# one to two hours, so a tag exists long before its assets do. Verification is
# the gate: no SHA256SUMS yet means no signature to check, so the formula is
# left alone and the next run picks it up. A half-published release cannot
# produce a bump, and a run that fails for any reason simply retries later
# instead of needing a manual recovery dispatch.
#
# A formula's mode -- prebuilt binary or built from source -- is never changed
# here. `make upgrade` branches on what the file already contains: asset urls
# get their versions and checksums rewritten, a git url gets its tag and
# revision rewritten, and nothing converts between the two. Switching a formula
# to binaries is a structural edit (on_macos/on_linux blocks replacing a
# top-level git url) and stays a deliberate human change, so a formula cannot
# oscillate between the two forms no matter what upstream is doing.
#
# What can go wrong is subtler: a project that has just grown a release
# pipeline gets a tag long before it gets assets, and pinning its formula to
# that tag mid-build produces a source bump that a binary bump immediately
# supersedes. SOURCE_GATE_MINUTES below is the wait that prevents it.
#
#     gh workflow run bump.yml -f formula=scan     # check one, now

name: bump

on:
  schedule:
    # Twice an hour, offset off the hour to dodge the cron stampede.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      formula:
        description: "Bump only this formula. Empty checks all of them."
        type: string
        default: ""

permissions: {}

concurrency:
  # One writer at a time; never interrupt a run mid-push.
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump formulas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # persist-credentials stays on here, unlike the release workflows: this
      # job's whole purpose is to push back to the repo it checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Bump formulas to their latest verified release
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.formula || '' }}
          # How long a release must have existed before a source-build formula
          # is pinned to its tag. Only matters for a project mid-conversion,
          # where a binary bump would otherwise supersede the source one an
          # hour later; for stng and filefacts, which have no pipeline at all,
          # this is pure delay. Dialed right down for now so a bump is easy to
          # provoke -- the cost of it being short is at most one superseded
          # source bump, since nothing here ever changes a formula's mode.
          SOURCE_GATE_MINUTES: "5"

          # How long a binary formula's release may go without verified assets
          # before the run says so out loud. Deliberately not the same number:
          # a healthy release matrix here runs 1h21m to 2h33m, so warning at
          # the source gate would fire on every successful release and train
          # everyone to ignore it. This one has to clear the slowest good run.
          STUCK_WARN_MINUTES: "360"
        run: |
          set -euo pipefail

          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

          # In config rather than inline on the commit: the retry path below
          # rebases, which replays commits of its own and dies with "empty
          # ident name" if the identity only ever reached one `git commit`.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          changed=""
          skipped=""

          for f in $(make -s formulas); do
            if [ -n "$ONLY" ] && [ "$ONLY" != "$f" ]; then
              continue
            fi

            repo="atomdrift-project/$f"
            if ! meta="$(gh release view --repo "$repo" \
                --json tagName,publishedAt -q '.tagName + " " + .publishedAt' 2>/dev/null)"; then
              echo "skip    $f - no releases published"
              continue
            fi
            tag="${meta% *}"
            published="${meta#* }"

            # python3 rather than `date -d`, so the same arithmetic works when
            # this loop is run by hand on a Mac.
            age="$(python3 -c "import datetime,sys; t=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00')); print(int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()//60))" "$published")"

            # Source-build formulas carry a tag and revision instead of asset
            # urls, and have no SHA256SUMS to verify against.
            if ! grep -q 'releases/download' "Formula/$f.rb"; then
              if grep -q "tag:.*\"$tag\"" "Formula/$f.rb"; then
                echo "ok      $f - already at $tag (source)"
                continue
              fi
              if [ "$age" -lt "$SOURCE_GATE_MINUTES" ]; then
                echo "wait    $f - $tag is ${age}m old, holding ${SOURCE_GATE_MINUTES}m in case binaries land"
                skipped="$skipped $f@$tag"
                continue
              fi
              make upgrade FORMULA="$f" VERSION="$tag"
              brew style "Formula/$f.rb"
              git add "Formula/$f.rb"
              changed="$changed $f@$tag(src)"
              echo "bumped  $f -> $tag (source)"
              continue
            fi

            if grep -q "/download/$tag/" "Formula/$f.rb"; then
              echo "ok      $f - already at $tag"
              continue
            fi

            rm -rf sums && mkdir sums
            if ! gh release download "$tag" --repo "$repo" \
                --pattern 'SHA256SUMS*' --dir sums 2>/dev/null; then
              # Never fall back to source here. The formula stays on its last
              # verified release, which still works, rather than being pushed
              # onto an unverified source build; past the gate that stops being
              # a slow release and starts being a broken one worth naming.
              if [ "$age" -ge "$STUCK_WARN_MINUTES" ]; then
                echo "::warning::$f $tag has had no verified assets for ${age}m - release pipeline may be stuck"
              else
                echo "wait    $f - $tag is ${age}m old, assets still building"
              fi
              skipped="$skipped $f@$tag"
              continue
            fi

            # A recovery dispatch signs from refs/heads/main while publishing a
            # tag (see the release workflow's note on this), so both identities
            # are accepted. Dots in the tag are escaped so the pattern cannot
            # match a version it was not meant to.
            esc_tag="$(printf '%s' "$tag" | sed 's/\./\\./g')"
            identity="^https://github\.com/$repo/\.github/workflows/release\.yml@refs/(tags/$esc_tag|heads/main)$"

            if ! cosign verify-blob sums/SHA256SUMS \
                --bundle sums/SHA256SUMS.sigstore.json \
                --certificate-identity-regexp "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com; then
              echo "::error::$f $tag failed signature verification - refusing to bump"
              exit 1
            fi

            # Pass the verified file through so the checksums written into the
            # formula are the bytes just checked, not a second fetch of them.
            make upgrade FORMULA="$f" VERSION="$tag" SUMS="$PWD/sums/SHA256SUMS"
            brew style "Formula/$f.rb"

            git add "Formula/$f.rb"
            changed="$changed $f@$tag"
            echo "bumped  $f -> $tag"
          done

          rm -rf sums

          {
            echo "### Formula bump"
            echo
            [ -n "$changed" ] && echo "- Bumped:$changed" || echo "- Bumped: nothing"
            [ -n "$skipped" ] && echo "- Awaiting assets:$skipped" || true
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$changed" ]; then
            echo "no formulas to bump"
            exit 0
          fi

          git commit -m "bump:$changed"

          # A human may have pushed to main between checkout and now. Rebase
          # onto whatever landed and retry rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            # A conflict means someone edited the same formula by hand. Leaving
            # the tree mid-rebase would make the next run start from a broken
            # checkout, so back it out and let a person look.
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::error::rebase conflict against main - resolve by hand"
              exit 1
            fi
          done
          echo "::error::could not push after 3 attempts"
          exit 1
